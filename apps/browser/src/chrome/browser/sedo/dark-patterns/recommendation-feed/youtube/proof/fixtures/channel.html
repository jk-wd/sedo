<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube channel fixture</title>
  <style>
    body * { display: block; min-height: 1px; }
  </style>
</head>
<body>
  <ytd-searchbox id="searchbox">Search</ytd-searchbox>
  <ytd-browse page-subtype="channels">
    <div id="primary">
      <ytd-rich-grid-renderer id="channel-grid">Uploads</ytd-rich-grid-renderer>
      <yt-lockup-view-model id="channel-lockup">Upload</yt-lockup-view-model>
      <ytd-continuation-item-renderer id="channel-continuation">More uploads</ytd-continuation-item-renderer>
    </div>
  </ytd-browse>
</body>
</html>
